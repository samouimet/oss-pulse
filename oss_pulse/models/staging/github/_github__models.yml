version: 2


# --- Repos
models:
 - name: stg_github__repos
   data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - repository_id
              - snapshot_date
   description: "One row per GitHub repository per daily snapshot"
   columns:
      - name: repository_id
        description: "GitHub’s numeric repository id; part of the primary key"
        data_tests:
          - not_null
      - name: owner_actor_id
        description: "A foreign key for this table"
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Date the repository data was pulled"
        data_tests:
          - not_null
      - name: stargazers_count
        description: "Number of times the repo has been starred"
        data_tests:
          - not_null
      - name: forks_count
        description: "Number of times the repo has been forked"
        data_tests:
          - not_null
      - name: open_issues_count
        description: "Number open issues for the repo"
        data_tests:
          - not_null

# --- Issues
 - name: stg_github__issues
   data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - issue_id
              - snapshot_date
   description: "One row per GitHub issue per daily snapshot"
   columns:
      - name: issue_id
        description: "GitHub's numeric issue id"
        data_tests:
          - not_null
      - name: number
        description: "Issue number within the repository"
        data_tests:
          - not_null
      - name: state
        description: "Issue state: open or closed"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: "When the issue was created"
        data_tests:
          - not_null
      - name: opened_by_actor_id
        description: "GitHub's numeric id of the user who opened the issue"
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Date the issue data was pulled"
        data_tests:
          - not_null
      - name: is_pull_request
        description: "True when the row is a pull request returned by the issues endpoint"
        data_tests:
          - not_null
      - name: repository_url
        description: "API URL of the repository; join key to the repos table"
        data_tests:
          - not_null

# --- Pull Requests
 - name: stg_github__pull_requests
   description: "One row per pull request per snapshot date, from the GitHub pulls endpoint"
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pull_request_id
              - snapshot_date
   columns:
      - name: pull_request_id
        description: "GitHub's numeric pull request id"
        data_tests:
          - not_null
      - name: number
        description: "Pull request number within the repository"
        data_tests:
          - not_null
      - name: state
        description: "Pull request state: open or closed (merged PRs are closed with merged_at set)"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: "When the pull request was created"
        data_tests:
          - not_null
      - name: opened_by_actor_id
        description: "GitHub's numeric id of the user who opened the pull request"
        data_tests:
          - not_null
      - name: repository_url
        description: "API URL of the target repository; join key to the repos table"
        data_tests:
          - not_null
      - name: base_ref
        description: "Branch the pull request targets"
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Date the pull request data was pulled"
        data_tests:
          - not_null

# --- Issue Comments
 - name: stg_github__issue_comments
   description: "One row per issue or pull request comment per snapshot date, from the GitHub issues comments endpoint"
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - comment_id
              - snapshot_date
   columns:
      - name: comment_id
        description: "GitHub's numeric comment id"
        data_tests:
          - not_null
      - name: author_actor_id
        description: "GitHub's numeric id of the user who wrote the comment"
        data_tests:
          - not_null
      - name: issue_url
        description: "API URL of the issue or pull request the comment belongs to; used later to find the parent"
        data_tests:
          - not_null
      - name: created_at
        description: "When the comment was created"
        data_tests:
          - not_null
      - name: html_url
        description: "Web link to the comment on GitHub"
      - name: snapshot_date
        description: "Date the comment data was pulled"
        data_tests:
          - not_null      
  
# --- Reviews
 - name: stg_github__reviews
   description: "One row per pull request review per snapshot date, from the GitHub pull request reviews endpoint"
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - review_id
              - snapshot_date
   columns:
      - name: review_id
        description: "GitHub's numeric review id"
        data_tests:
          - not_null
      - name: pull_request_number
        description: "Number of the pull request the review belongs to, within its repository"
        data_tests:
          - not_null
      - name: pull_request_url
        description: "API URL of the pull request the review belongs to; includes the repository"
        data_tests:
          - not_null
      - name: submitted_by_actor_id
        description: "GitHub's numeric id of the user who submitted the review"
        data_tests:
          - not_null
      - name: state
        description: "Review state: COMMENTED, APPROVED, DISMISSED, or CHANGES_REQUESTED"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMMENTED', 'APPROVED', 'DISMISSED', 'CHANGES_REQUESTED']
      - name: snapshot_date
        description: "Date the review data was pulled"
        data_tests:
          - not_null

# --- Commits

 - name: stg_github__commits
   description: "One row per commit per snapshot date, from the GitHub commits endpoint"
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - commit_sha
              - snapshot_date
   columns:
      - name: commit_sha
        description: "Git SHA that identifies the commit"
        data_tests:
          - not_null
      - name: author_actor_id
        description: "GitHub's numeric id of the commit author; null when the commit email doesn't match a GitHub account"
      - name: repository_url
        description: "API URL of the repository the commit belongs to; join key to the repos table"
        data_tests:
          - not_null
      - name: authored_at
        description: "When the commit was authored"
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Date the commit data was pulled"
        data_tests:
          - not_null


# --- Releases
 - name: stg_github__releases
   description: "One row per release per snapshot date, from the GitHub releases endpoint"
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - release_id
              - snapshot_date
   columns:
      - name: release_id
        description: "GitHub's numeric release id"
        data_tests:
          - not_null
      - name: repository_url
        description: "API URL of the repository the release belongs to; join key to the repos table"
        data_tests:
          - not_null
      - name: tag_name
        description: "Git tag the release is attached to, such as v2.0.8"
        data_tests:
          - not_null
      - name: created_at
        description: "When the release was created"
        data_tests:
          - not_null
      - name: published_at
        description: "When the release was published; null for drafts"
      - name: snapshot_date
        description: "Date the release data was pulled"
        data_tests:
          - not_null