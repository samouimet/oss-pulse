version: 2

sources:
  - name: github
    tables:
      - name: repos
        meta:
          external_location: "read_json('../data/raw/repos/*/*/repo.json')"
      - name: issues
        meta:
          external_location: "read_json('../data/raw/issues/*/*/*.json')"
      - name: pull_requests
        meta:
          external_location: "read_json('../data/raw/pull_requests/*/*/*.json')"
      - name: issue_comments
        meta:
          external_location: "read_json('../data/raw/issue_comments/*/*/*.json')"          
      - name: reviews
        meta:
          external_location: "read_json('../data/raw/reviews/*/*/*.json')"   