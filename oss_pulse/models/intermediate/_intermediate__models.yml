version: 2

models:
  - name: int_actors_unioned
    description: "One row per actor appearance across all sources"
    columns:
    - name: actor_id
      data_tests: 
      - not_null
    - name: snapshot_date
      data_tests:
      - not_null
      
  - name: int_issues_joined
    data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - issue_id
              - snapshot_date
    description: "One row per issue per snapshot date; pull requests excluded"
    columns:
    - name: issue_id
      data_tests: 
      - not_null
    - name: repository_id
      data_tests:
      - not_null

  - name: int_issues_first_response
    description: "One row per issue that has received a response; the first comment from a non-author, non-bot user"
    columns:
    - name: issue_id
      description: "GitHub's numeric issue id; one row per issue"
      data_tests:
      - not_null
      - unique
    - name: first_response_at
      description: "Time of the first qualifying comment"
      data_tests:
      - not_null

  - name: int_pull_requests_first_review
    description: "One row per pull request that has received a review. Includes the review time of the first review from a non-opener, non-bot user"
    columns:
      - name: pull_request_id
        data_tests:
          - unique
          - not_null
      - name: first_review_at
        data_tests:
          - not_null

  - name: int_contributor_activity
    description: "One row per human activity: a comment, commit, review, issue opened or closed, or pull request opened. Bot activity and activity with no matched actor (such as commits by authors with no GitHub account) are excluded."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - activity_type
              - source_id
    columns:
      - name: activity_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['comment', 'commit', 'review', 'issue_opened', 'issue_closed', 'pull_request_opened']
      - name: source_id
        data_tests:
          - not_null
      - name: actor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: activity_at
        data_tests:
          - not_null
      - name: repository_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repository')
                field: repository_id


  - name: int_contributor_monthly
    description: "One row per contributor per repository per month in which they had any activity, with a count for each activity type. A month with no activity has no row. Bots and unmatched authors are already excluded upstream."
    data_tests:
      # grain test: one row per (repo, actor, month)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - repository_id
              - actor_id
              - activity_month
      # cross-check: the total must equal the six per-type counts added up,
      # so a new activity type upstream can't slip through uncounted
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_activities = comment_count + commit_count + review_count + issue_opened_count + issue_closed_count + pull_request_opened_count"
    columns:
      - name: activity_month
        description: "First day of the month (UTC) the activity happened in."
        data_tests:
          - not_null
      - name: repository_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repository')
                field: repository_id
      - name: actor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: total_activities
        description: "Count of all activities in the month, across every type."
        data_tests:
          - not_null


  - name: int_contributor_status_monthly
    description: "One row per contributor per repository per month with a growth-accounting status: new, retained, resurrected or churned. Churned rows are created for the month after a contributor's last active month, so they have no matching row in int_contributor_monthly."
    data_tests:
      # grain test: one status per (repo, actor, month)
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - repository_id
              - actor_id
              - activity_month
    columns:
      - name: repository_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repository')
                field: repository_id
      - name: actor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: activity_month
        description: "First day of the month (UTC). For churned rows, the month after the last active month."
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'retained', 'resurrected', 'churned']