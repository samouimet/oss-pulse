version: 2

models:
  - name: int_actors_unioned
    description: "One row per actor appearance across all sources"
    columns:
    - name: actor_id
      data_tests: 
      - not_null
    - name: snapshot_date
      data_tests:
      - not_null
      
  - name: int_issues_joined
    data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - issue_id
              - snapshot_date
    description: "One row per issue per snapshot date; pull requests excluded"
    columns:
    - name: issue_id
      data_tests: 
      - not_null
    - name: repository_id
      data_tests:
      - not_null
