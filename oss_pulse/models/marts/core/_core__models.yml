version: 2

models:

# --- Repository
 - name: dim_repository
   description: "One row per GitHub repository"
   columns:
      - name: repository_id
        description: "GitHub's numeric repository id; primary key"
        data_tests:
          - not_null
          - unique
      - name: owner_actor_id
        description: "A foreign key for this table"
        data_tests:
          - not_null
        relationships:
          to: ref('dim_actor')
          field: 'actor_id'
        
 - name: fct_repository_daily
   data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - repository_id
              - snapshot_date
   description: "One row per GitHub repository and snapshot date"
   columns:
      - name: repository_id
        description: "GitHub's numeric repository id; one part of the primary key"
        data_tests:
          - not_null
      - name: snapshot_date
        description: "Date the repository data was pulled; second part of the primary key"
        data_tests:
          - not_null

# --- Actors
 - name: dim_actor
   description: "One row per GitHub actor"
   columns:
      - name: login
        description: "Most recent GitHub username for the actor"
        data_tests:
          - not_null
      - name: type
        description: "Account type: User, Bot, or Organization"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['User', 'Bot', 'Organization']
      - name: is_bot
        description: "True when the actor's type is Bot"
        data_tests:
          - not_null

# --- Issues
 - name: dim_issue
   description: "One row per GitHub issue (pull requests excluded), latest version"
   columns:
      - name: issue_id
        description: "GitHub's numeric issue id; primary key"
        data_tests:
          - not_null
          - unique
      - name: opened_by_actor_id
        description: "Foreign key to dim_actor; the user who opened the issue"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: closed_by_actor_id
        description: "Foreign key to dim_actor; the user who closed the issue, null while open"
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: repository_id
        description: "Foreign key to dim_repository"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repository')
                field: repository_id
      - name: state
        description: "Issue state: open or closed"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['open', 'closed']
      - name: created_at
        description: "When the issue was created"
        data_tests:
          - not_null
      - name: number
        description: "Issue number within its repository"
        data_tests:
          - not_null
      - name: first_response_at
        description: "Time of the first comment by a non-author, non-bot user; null if no response yet"

 - name: fct_issue_daily
   description: "One row per issue per snapshot date"
   data_tests:
    - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - issue_id
              - snapshot_date
   columns:
      - name: issue_id
        description: "Foreign key to dim_issue; one part of the primary key"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_issue')
                field: issue_id
      - name: snapshot_date
        description: "Date the issue data was pulled; second part of the primary key"
        data_tests:
          - not_null
      - name: reactions_total_count
        description: "Total reactions on the issue on that date"
        data_tests:
          - not_null

# --- Pull request
 - name: dim_pull_request
   columns:
      - name: pull_request_id
        data_tests:
          - unique
          - not_null
      - name: repository_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_repository')
                field: repository_id
      - name: opened_by_actor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: state
        data_tests:
          - accepted_values:
              arguments:
                values: ['open', 'closed']


# --- Issue comments
 - name: dim_issue_comment
   description: "One row per comment on an issue or pull request, latest version. Exactly one of issue_id or pull_request_id is filled."
   data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(issue_id is null) != (pull_request_id is null)"
   columns:
      - name: comment_id
        data_tests:
          - unique
          - not_null
      - name: author_actor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: issue_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_issue')
                field: issue_id
      - name: pull_request_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_pull_request')
                field: pull_request_id
      - name: created_at
        data_tests:
          - not_null

 - name: fct_issue_comment_daily
   description: "One row per comment per snapshot date, with the reaction count on that date."
   data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - comment_id
              - snapshot_date
   columns:
      - name: comment_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_issue_comment')
                field: comment_id
      - name: snapshot_date
        data_tests:
          - not_null
      - name: reactions_total_count
        data_tests:
          - not_null
          
# --- Review
 - name: dim_review
   description: "One row per pull request review, latest version."
   columns:
      - name: review_id
        data_tests:
          - unique
          - not_null
      - name: pull_request_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pull_request')
                field: pull_request_id
      - name: submitted_by_actor_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_actor')
                field: actor_id
      - name: state
        data_tests:
          - accepted_values:
              arguments:
                values: ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED', 'DISMISSED', 'PENDING']
      - name: submitted_at
        data_tests:
          - not_null